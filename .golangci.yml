# golangci-lint v2 configuration for gorly (migrated from the v1 file in 1.3.1;
# the v1 file could not be loaded by golangci-lint v2, so the CI lint step and
# `make lint` had silently stopped working).
# Docs: https://golangci-lint.run/docs/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA1029|SA4006"
      - path: examples/
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/itsatony/gorly
