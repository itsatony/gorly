name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.24.x, 1.25.x] # go.mod requires 1.24.6
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      run: make fmt-check

    - name: Run linter
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

    # The ACL-only + TLS-only Redis fixtures the stores ACL/TLS tests run
    # against. CI=true makes those tests FAIL (not skip) if this step is lost.
    - name: Start ACL/TLS Redis fixtures
      run: |
        GORLY_CONTAINER_RUNTIME=docker GORLY_SKIP_PLAIN=1 bash scripts/setup-redis-secure.sh \
          | sed -n 's/^export //p' >> "$GITHUB_ENV"

    - name: Run tests
      run: make test

    - name: Run tests with race detection
      run: make test-race

    - name: Generate coverage report
      run: make coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run integration tests
      run: make integration-test
      env:
        REDIS_URL: redis://localhost:6379

    - name: Run benchmarks
      run: make bench

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x

    - name: Build
      run: make build

    - name: Verify build
      run: |
        echo "Build verification successful - library compiles without errors"

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x

    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    # ⛔ The BLOCKING security gate is the `gosec` linter inside golangci-lint
    # (lint job, .golangci.yml: excluded only for _test.go and examples/), which
    # honours the reviewed //nolint:gosec directives. This job only produces the
    # SARIF report for code scanning, which is why -no-fail is confined to it.
    - name: Gosec SARIF report (informational; gating is golangci-lint gosec)
      run: gosec -no-fail -fmt sarif -out gosec.sarif ./...

    - name: Upload SARIF file
      continue-on-error: true # code scanning may be unavailable on this repo plan
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec.sarif


  release:
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_v${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}